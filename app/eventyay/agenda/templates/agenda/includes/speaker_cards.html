{% load i18n %}
{% for speaker in speakers_cards %}
  <a class="speaker-card" href="{{ speaker.profile_url }}">
    <div class="speaker-card-avatar">
      {% if speaker.avatar %}
        <img
          src="{{ speaker.avatar.src }}"
          {% if speaker.avatar.srcset %}srcset="{{ speaker.avatar.srcset }}" sizes="72px"{% endif %}
          width="72"
          height="72"
          loading="lazy"
          decoding="async"
          alt="{{ speaker.name }}">
      {% else %}
        <div class="avatar-placeholder" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path fill="currentColor" d="M12,1A5.8,5.8 0 0,1 17.8,6.8A5.8,5.8 0 0,1 12,12.6A5.8,5.8 0 0,1 6.2,6.8A5.8,5.8 0 0,1 12,1M12,15C18.63,15 24,17.67 24,21V23H0V21C0,17.67 5.37,15 12,15Z" />
          </svg>
        </div>
      {% endif %}
    </div>
    <div class="speaker-card-info">
      <div class="speaker-card-name">{{ speaker.name }}</div>
      {% if speaker.is_featured %}
        <span class="speaker-card-badge">{% translate 'Featured' %}</span>
      {% endif %}
    </div>
  </a>
{% endfor %}
